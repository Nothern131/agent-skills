<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>心口不一算法 — 互动对话演示</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0B0E14;color:#E8E6E3;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  height:100vh;overflow:hidden;user-select:none;
}
.app{display:flex;height:100vh}
/* ═══ 左侧 NPC 面板 ═══ */
.sidebar{
  width:260px;min-width:260px;background:#11151D;border-right:1px solid #1E2430;
  display:flex;flex-direction:column;overflow-y:auto;
}
.sidebar-header{padding:16px;border-bottom:1px solid #1E2430}
.sidebar-header h2{font-size:14px;color:#F0B958;font-weight:600}
.sidebar-header .desc{font-size:10px;color:#6B7280;margin-top:4px}
.npc-list{flex:1;overflow-y:auto;padding:8px}
.npc-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  cursor:pointer;border:1px solid transparent;transition:all .2s;margin-bottom:4px;
  position:relative;
}
.npc-item:hover{background:#1A1D27}
.npc-item.active{border-color:#F0B958;background:rgba(240,185,88,.08)}
.npc-item .avatar{
  width:36px;height:36px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.npc-item .info{flex:1;min-width:0}
.npc-item .info .name{font-size:13px;font-weight:600}
.npc-item .info .role{font-size:10px;color:#6B7280}
.npc-item .dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  opacity:0;transition:opacity .3s;
}
.npc-item .dot.lit{opacity:1;animation:pulse .8s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.8)}}
/* 性格条 */
.npc-panel{display:none;padding:12px;border-top:1px solid #1E2430}
.npc-panel.show{display:block}
.npc-panel h3{font-size:11px;color:#6B7280;margin-bottom:8px;letter-spacing:1px}
.trait-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.trait-row .trait-label{width:32px;font-size:9px;color:#9CA3AF;text-align:right;flex-shrink:0}
.trait-row .trait-bar{flex:1;height:4px;background:#1E2430;border-radius:2px;overflow:hidden}
.trait-row .trait-fill{height:100%;border-radius:2px;transition:width .3s}
.trait-row .trait-val{width:24px;font-size:9px;color:#6B7280;text-align:right;flex-shrink:0}
.trait-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#1E2430;border-radius:2px;cursor:pointer}
.trait-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#F0B958;cursor:pointer}

/* ═══ 中央聊天区 ═══ */
.chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{
  padding:12px 20px;border-bottom:1px solid #1E2430;display:flex;
  align-items:center;gap:12px;flex-shrink:0;
}
.chat-header .ctx-picker{display:flex;gap:6px;flex-wrap:wrap}
.chat-header .ctx-pill{
  padding:4px 12px;border-radius:14px;border:1px solid #2A2D37;font-size:10px;
  cursor:pointer;background:#1A1D27;color:#9CA3AF;font-family:inherit;transition:all .2s;
}
.chat-header .ctx-pill:hover{border-color:#4ADE80;color:#E8E6E3}
.chat-header .ctx-pill.on{background:rgba(74,222,128,.15);color:#4ADE80;border-color:#4ADE80}
.chat-messages{
  flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;
  scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:#2A2D37;border-radius:2px}
/* 空状态 */
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:#4B5563;font-size:14px;text-align:center;line-height:2}
.empty-state b{color:#F0B958}
/* 消息气泡 */
.msg-row{display:flex;flex-direction:column;animation:msgIn .4s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{align-items:flex-end}
.msg-row.npc{align-items:flex-start}
.msg-row .msg-meta{font-size:9px;color:#4B5563;margin-bottom:2px;padding:0 4px}
.msg-row .msg-bubble{
  max-width:70%;padding:10px 16px;border-radius:14px;font-size:14px;line-height:1.7;
}
.msg-row.user .msg-bubble{background:#1E3A5F;color:#93C5FD;border-bottom-right-radius:4px}
.msg-row.npc .msg-bubble{background:#252836;color:#E8E6E3;border-bottom-left-radius:4px}
/* NPC 双气泡 */
.dual-bubble{display:flex;flex-direction:column;gap:6px;max-width:70%}
.dual-bubble .surface-bubble{
  padding:10px 16px;border-radius:14px;border-bottom-left-radius:4px;
  background:#252836;color:#E8E6E3;font-size:14px;line-height:1.7;
  border-left:3px solid #4ADE80;
}
.dual-bubble .inner-bubble{
  padding:10px 16px;border-radius:14px;border-bottom-left-radius:4px;
  background:rgba(168,123,250,.1);color:#A78BFA;font-size:13px;line-height:1.7;
  border-left:3px solid #A78BFA;font-style:italic;
}
.dual-bubble .bubble-label{
  font-size:8px;font-weight:700;letter-spacing:2px;margin-bottom:4px;display:block;
}
.dual-bubble .surface-bubble .bubble-label{color:#4ADE80}
.dual-bubble .inner-bubble .bubble-label{color:#A78BFA}
/* 分歧标签 */
.div-tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;
  font-size:10px;font-weight:600;margin-top:4px;
}
/* 分隔线 */
.divider{display:flex;align-items:center;gap:8px;margin:4px 0;animation:msgIn .4s ease both}
.divider .line{flex:1;height:1px;background:#1E2430}
.divider .text{font-size:9px;color:#4B5563;white-space:nowrap;letter-spacing:1px}

/* ═══ 右侧算法面板 ═══ */
.algo-panel{
  width:300px;min-width:300px;background:#11151D;border-left:1px solid #1E2430;
  display:flex;flex-direction:column;overflow-y:auto;padding:16px;
}
.algo-panel h3{font-size:12px;color:#F0B958;margin-bottom:10px;letter-spacing:1px}
.algo-panel .section{margin-bottom:16px}
.algo-panel .section-title{font-size:10px;color:#6B7280;letter-spacing:1px;margin-bottom:6px}
.algo-step{
  padding:8px 10px;border-radius:8px;background:#1A1D27;margin-bottom:6px;
  font-size:10px;color:#9CA3AF;border-left:2px solid #2A2D37;transition:all .3s;
}
.algo-step.active{border-left-color:#4ADE80;background:rgba(74,222,128,.05)}
.algo-step .step-num{color:#4ADE80;font-weight:700;margin-right:4px}
.algo-step .step-action{color:#E8E6E3;font-weight:600}
.algo-step .step-result{color:#F0B958;margin-top:2px}
.algo-decision{
  padding:10px;border-radius:8px;background:rgba(192,132,252,.08);border:1px solid rgba(192,132,252,.2);
  font-size:10px;color:#C084FC;margin-top:8px;text-align:center;display:none;
}
.algo-decision.show{display:block;animation:msgIn .3s ease both}
.type-list{display:flex;flex-direction:column;gap:4px}
.type-item{display:flex;align-items:center;gap:6px;font-size:10px;padding:4px 8px;border-radius:6px;background:#1A1D27}
.type-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.type-item .score{font-family:"JetBrains Mono",monospace;color:#F0B958;margin-left:auto}

/* ═══ 输入区 ═══ */
.input-area{
  padding:12px 20px;border-top:1px solid #1E2430;display:flex;gap:10px;flex-shrink:0;
}
.input-area input{
  flex:1;padding:10px 16px;border-radius:10px;border:1px solid #2A2D37;
  background:#1A1D27;color:#E8E6E3;font-size:13px;font-family:inherit;outline:none;
  transition:border-color .2s;
}
.input-area input:focus{border-color:#F0B958}
.input-area input::placeholder{color:#4B5563}
.input-area button{
  padding:10px 18px;border-radius:10px;border:1px solid #F0B958;
  background:rgba(240,185,88,.15);color:#F0B958;font-size:13px;cursor:pointer;
  font-family:inherit;transition:all .2s;white-space:nowrap;
}
.input-area button:hover{background:rgba(240,185,88,.25)}
.input-area button:disabled{opacity:.4;cursor:not-allowed}
/* 快捷短语 */
.quick-phrases{display:flex;gap:6px;padding:4px 20px 8px;flex-wrap:wrap;flex-shrink:0}
.quick-phrase{
  padding:3px 10px;border-radius:10px;border:1px solid #2A2D37;font-size:10px;
  cursor:pointer;background:#1A1D27;color:#6B7280;font-family:inherit;transition:all .2s;
}
.quick-phrase:hover{border-color:#4ADE80;color:#E8E6E3}
/* 删除按钮 */
.npc-delete-btn{
  position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;
  border:none;background:rgba(248,113,113,.15);color:#F87171;font-size:11px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;
}
.npc-item:hover .npc-delete-btn{opacity:1}
.npc-delete-btn:hover{background:rgba(248,113,113,.3)}
/* 添加NPC按钮 */
.npc-add-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;
  margin:8px;border-radius:10px;border:1px dashed #2A2D37;background:transparent;
  color:#6B7280;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;
}
.npc-add-btn:hover{border-color:#F0B958;color:#F0B958;background:rgba(240,185,88,.05)}
/* 创建面板（模态） */
.create-backdrop{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.6);z-index:100;backdrop-filter:blur(4px);
}
.create-backdrop.open{display:block}
.create-panel{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:420px;max-height:85vh;background:#11151D;border:1px solid #1E2430;
  border-radius:16px;z-index:101;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.create-panel.open{display:flex}
.create-panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid #1E2430;
}
.create-panel-head span{font-size:14px;color:#F0B958;font-weight:600}
.create-panel-head button{
  width:28px;height:28px;border-radius:50%;border:none;
  background:rgba(248,113,113,.1);color:#F87171;font-size:14px;cursor:pointer;
}
.create-panel-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.create-field{display:flex;flex-direction:column;gap:4px}
.create-label{font-size:10px;color:#6B7280;letter-spacing:1px;font-weight:600}
.create-input,.create-select{
  padding:8px 12px;border-radius:8px;border:1px solid #2A2D37;
  background:#1A1D27;color:#E8E6E3;font-size:13px;font-family:inherit;outline:none;
}
.create-input:focus,.create-select:focus{border-color:#F0B958}
.create-row{display:flex;gap:10px}
.create-row .create-field{flex:1}
.create-color{width:100%;height:34px;border:none;border-radius:8px;cursor:pointer;background:transparent}
.create-preview{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:#1A1D27}
.create-preview-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.create-preview-info{font-size:11px;color:#9CA3AF;line-height:1.5}
.create-preview-info strong{color:#E8E6E3}
.create-presets{display:flex;flex-wrap:wrap;gap:6px}
.preset-btn{
  padding:4px 10px;border-radius:6px;border:1px solid #2A2D37;
  background:#1A1D27;color:#9CA3AF;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s;
}
.preset-btn:hover{border-color:#C084FC;color:#C084FC}
.create-traits{display:flex;flex-direction:column;gap:6px}
.create-trait{display:flex;align-items:center;gap:8px}
.create-trait label{width:32px;font-size:10px;color:#9CA3AF;text-align:right;flex-shrink:0}
.create-trait input[type=range]{flex:1;height:4px;-webkit-appearance:none;appearance:none;background:#1E2430;border-radius:2px;cursor:pointer}
.create-trait input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#F0B958;cursor:pointer}
.create-trait .mt-val{width:24px;font-size:9px;color:#6B7280;text-align:right;flex-shrink:0}
.create-actions{display:flex;gap:8px;padding:16px 20px;border-top:1px solid #1E2430}
.create-actions button{
  flex:1;padding:8px;border-radius:8px;border:1px solid #2A2D37;
  background:#1A1D27;color:#9CA3AF;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;
}
.create-actions button.primary{background:rgba(240,185,88,.15);color:#F0B958;border-color:#F0B958}
.create-actions button.primary:hover{background:rgba(240,185,88,.25)}
.create-actions button.danger{background:rgba(248,113,113,.1);color:#F87171;border-color:rgba(248,113,113,.3)}
.create-actions button.danger:hover{background:rgba(248,113,113,.2)}

/* ═══ 响应式 ═══ */
@media(max-width:900px){
  .sidebar{width:200px;min-width:200px}
  .algo-panel{width:220px;min-width:220px}
}
@media(max-width:680px){
  .algo-panel{display:none}
  .sidebar{width:160px;min-width:160px}
}
</style>
</head>
<body>

<div class="app">
  <!-- ═══════════ 左侧 NPC 面板 ═══════════ -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>NPC 角色</h2>
      <div class="desc">点击选择对话对象</div>
    </div>
    <div class="npc-list" id="npcList"></div>
    <button class="npc-add-btn" onclick="openCreatePanel()">+ 添加NPC</button>
    <div class="npc-panel" id="npcPanel">
      <h3>性格参数（可拖动调整）</h3>
      <div id="traitSliders"></div>
    </div>
  </div>

  <!-- ═══════════ 中央聊天区 ═══════════ -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="ctx-picker" id="ctxPicker"></div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state">
        <div>
          <b>点击左侧NPC头像开始对话</b><br>
          输入你想说的话，看NPC<br>
          表面回答 vs 真实想法
        </div>
      </div>
    </div>
    <div class="quick-phrases" id="quickPhrases"></div>
    <div class="input-area">
      <input type="text" id="msgInput" placeholder="输入你想对NPC说的话..." disabled>
      <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
    </div>
  </div>

  <!-- ═══════════ 右侧算法面板 ═══════════ -->
  <div class="algo-panel" id="algoPanel">
    <h3>算法决策追踪</h3>
    <div class="section">
      <div class="section-title">步骤 1：关键词提取</div>
      <div class="algo-step" id="step1">等待输入...</div>
    </div>
    <div class="section">
      <div class="section-title">步骤 2：情境推断</div>
      <div class="algo-step" id="step2">等待输入...</div>
    </div>
    <div class="section">
      <div class="section-title">步骤 3：5种分歧评分</div>
      <div class="type-list" id="typeList">
        <div class="type-item"><span class="dot" style="background:#4ADE80"></span>善意谎言 <span class="score">-</span></div>
        <div class="type-item"><span class="dot" style="background:#F0B958"></span>心口不一 <span class="score">-</span></div>
        <div class="type-item"><span class="dot" style="background:#F87171"></span>隐藏恐惧 <span class="score">-</span></div>
        <div class="type-item"><span class="dot" style="background:#60A5FA"></span>沉默风暴 <span class="score">-</span></div>
        <div class="type-item"><span class="dot" style="background:#C084FC"></span>社交伪装 <span class="score">-</span></div>
      </div>
    </div>
    <div class="algo-decision" id="algoDecision"></div>
  </div>
</div>

<!-- ═══════════ 创建NPC面板（模态） ═══════════ -->
<div class="create-backdrop" id="createBackdrop" onclick="closeCreatePanel()"></div>
<div class="create-panel" id="createPanel">
  <div class="create-panel-head">
    <span>✦ 孕育新意识体</span>
    <button onclick="closeCreatePanel()">✕</button>
  </div>
  <div class="create-panel-body">
    <div class="create-field"><label class="create-label">名称</label><input type="text" class="create-input" id="c-name" placeholder="新角色名字" maxlength="6" oninput="updateCreatePreview()"></div>
    <div class="create-row">
      <div class="create-field"><label class="create-label">身份</label><input type="text" class="create-input" id="c-role" list="role-presets" placeholder="输入或选择…" maxlength="6" oninput="updateCreatePreview()"><datalist id="role-presets"><option value="猎户"><option value="铁匠"><option value="书生"><option value="侠客"><option value="村民"><option value="郎中"><option value="厨子"><option value="渔夫"><option value="樵夫"><option value="商贩"><option value="酒鬼"><option value="乞丐"><option value="更夫"><option value="货郎"><option value="屠户"><option value="绣娘"><option value="画师"><option value="琴师"><option value="说书"><option value="道士"></datalist></div>
      <div class="create-field"><label class="create-label">头像</label><input type="text" class="create-select" id="c-avatar" list="avatar-presets" placeholder="🗡" maxlength="2" oninput="updateCreatePreview()"><datalist id="avatar-presets"><option value="🗡"><option value="🛡"><option value="🏹"><option value="🧙"><option value="🕯"><option value="🐺"><option value="🦊"><option value="🐴"><option value="⚒"><option value="🐟"><option value="🍺"><option value="🎭"><option value="🌿"><option value="🎪"><option value="⚡"><option value="⚔"><option value="🪓"><option value="🔥"><option value="💧"><option value="🌙"></datalist></div>
    </div>
    <div class="create-row">
      <div class="create-field"><label class="create-label">色调</label><input type="color" class="create-color" id="c-color" value="#60a5fa" oninput="updateCreatePreview()"></div>
      <div class="create-field"><label class="create-label">说话风格</label><input type="text" class="create-select" id="c-style" list="style-presets" placeholder="普普通通" maxlength="6" oninput="updateCreatePreview()"><datalist id="style-presets"><option value="沉默寡言"><option value="普普通通"><option value="絮絮叨叨"><option value="温温柔柔"></datalist></div>
    </div>
    <div class="create-preview">
      <div class="create-preview-avatar" id="createPreviewAvatar" style="background:rgba(96,165,250,.1);color:#60a5fa">🗡</div>
      <div class="create-preview-info">预览：<strong id="createPreviewName">新意识体</strong><br><span id="createPreviewRole">村民</span></div>
    </div>
    <label class="create-label">性格参数 <span style="font-weight:400;font-size:9px;color:#6B7280;margin-left:4px">预设</span></label>
    <div class="create-presets">
      <button class="preset-btn" onclick="applyPreset('热心肠')" title="正义↑善良↑社交↑">热心肠</button>
      <button class="preset-btn" onclick="applyPreset('铁公鸡')" title="贪婪↑沉默↑">铁公鸡</button>
      <button class="preset-btn" onclick="applyPreset('急性子')" title="暴躁↑好奇↑">急性子</button>
      <button class="preset-btn" onclick="applyPreset('老好人')" title="善良↑沉默↑">老好人</button>
      <button class="preset-btn" onclick="applyPreset('独行侠')" title="沉默↑勇敢↑社交↓">独行侠</button>
      <button class="preset-btn" onclick="applyPreset('乐天派')" title="善良↑好奇↑">乐天派</button>
    </div>
    <div class="create-traits" id="c-traits"></div>
  </div>
  <div class="create-actions">
    <button onclick="randomizeTraits()">🎲 随机</button>
    <button class="primary" onclick="createNPC()">✦ 孕育</button>
  </div>
</div>

<script>

// 语义理解管线：提取关键词→激活概念→性格加权→形成理解（来自灵魂工坊 v4）
function understandEvent(msg,npc){
  var text=msg;var p=npc.personality;
  // 1. 提取关键词
  var keywords=[];
  for(var word in SEMANTIC_MAP){if(text.indexOf(word)>=0)keywords.push(word);}
  // 关键词去重：如果短词被长词完全包含，过滤短词（如"死"被"死了"包含）
  var filteredKeywords=[];
  for(var i=0;i<keywords.length;i++){
    var isSubstring=false;
    for(var j=0;j<keywords.length;j++){
      if(i!==j&&keywords[j].length>keywords[i].length&&keywords[j].indexOf(keywords[i])>=0){
        isSubstring=true;break;
      }
    }
    if(!isSubstring)filteredKeywords.push(keywords[i]);
  }
  keywords=filteredKeywords;
  // 字符级回退：当关键词匹配失败时，用单字特征推断语义
  if(keywords.length===0){
    var charDanger={火:1,灾:1,死:1,血:1,杀:1,毒:1,炸:1,爆:1,毁:1,灭:1,亡:1,逃:1,跑:1,喊:1,叫:1,救:1,病:1,伤:1,痛:1,鬼:1,妖:1,怪:1,贼:1,盗:1,偷:1,抢:1,打:1,斗:1,战:1,狼:1,虎:1,蛇:1,兽:1,崩:1,塌:1,裂:1,断:1};
    var charUrgency={火:1,灾:1,救:1,逃:1,跑:1,喊:1,叫:1,急:1,快:1,危:1,险:1,死:1,杀:1,血:1};
    var charSad={死:1,亡:1,哭:1,泪:1,伤:1,痛:1,病:1,失:1,丢:1,丧:1,葬:1,灭:1,毁:1,别:1,离:1,悲:1,哀:1,愁:1,惨:1,孤:1,寂:1};
    var charCuriosity={怪:1,秘:1,密:1,疑:1,奇:1,新:1,外:1,远:1,暗:1,隐:1,藏:1};
    var charMoney={银:1,金:1,钱:1,财:1,宝:1,富:1,贵:1,铜:1,两:1,贯:1,钞:1,币:1,贝:1};
    var charAnger={怒:1,恨:1,怨:1,愤:1,恼:1,烦:1,厌:1,恶:1,憎:1,仇:1,气:1,骂:1,咒:1};
    var charHappy={喜:1,乐:1,欢:1,笑:1,福:1,幸:1,爱:1,暖:1,甜:1,美:1};
    var dangerScore=0,urgencyScore=0,sadScore=0,curiosityScore=0,moneyScore=0,angerScore=0,happyScore=0;
    for(var i=0;i<text.length;i++){var ch=text[i];
      if(charDanger[ch])dangerScore+=charDanger[ch];
      if(charUrgency[ch])urgencyScore+=charUrgency[ch];
      if(charSad[ch])sadScore+=charSad[ch];
      if(charCuriosity[ch])curiosityScore+=charCuriosity[ch];
      if(charMoney[ch])moneyScore+=charMoney[ch];
      if(charAnger[ch])angerScore+=charAnger[ch];
      if(charHappy[ch])happyScore+=charHappy[ch];
    }
    var fallbackConcepts=[];
    if(dangerScore>0)fallbackConcepts.push('危险');
    if(urgencyScore>0)fallbackConcepts.push('紧急');
    if(sadScore>0)fallbackConcepts.push('悲伤');
    if(curiosityScore>0)fallbackConcepts.push('未知');
    if(moneyScore>0)fallbackConcepts.push('财富');
    if(angerScore>0)fallbackConcepts.push('冲突');
    if(happyScore>0)fallbackConcepts.push('快乐');
    if(fallbackConcepts.length===0)fallbackConcepts.push('日常');
    // 性格透镜加权
    var conceptAct={};
    fallbackConcepts.forEach(function(c){conceptAct[c]=(conceptAct[c]||0)+1;});
    for(var trait in PERSONALITY_LENS){
      var weight=p[trait]/100;
      var lens=PERSONALITY_LENS[trait];
      for(var concept in lens){
        if(conceptAct[concept]!==undefined){conceptAct[concept]+=lens[concept]*weight;}
      }
    }
    var topConcepts=Object.keys(conceptAct).filter(function(c){return conceptAct[c]>0;}).sort(function(a,b){return conceptAct[b]-conceptAct[a];}).slice(0,4);
    return {keywords:keywords,concepts:topConcepts,dominantEmotion:'',emotionAct:{},interpretation:topConcepts.join('，'),subject:extractSubject(text),fallback:true};
  }
  // 2. 激活概念+情绪
  var conceptAct={};var emotionAct={};
  keywords.forEach(function(kw){
    var sem=SEMANTIC_MAP[kw];if(!sem)return;
    sem.concepts.forEach(function(c){conceptAct[c]=(conceptAct[c]||0)+1;});
    for(var e in sem.emo){emotionAct[e]=(emotionAct[e]||0)+sem.emo[e];}
  });
  // 3. 性格透镜加权
  for(var trait in PERSONALITY_LENS){
    var weight=p[trait]/100;
    var lens=PERSONALITY_LENS[trait];
    for(var concept in lens){
      if(conceptAct[concept]!==undefined){conceptAct[concept]+=lens[concept]*weight;}
    }
  }
  // 4. 排序取Top概念
  var topConcepts=Object.keys(conceptAct).filter(function(c){return conceptAct[c]>0;}).sort(function(a,b){return conceptAct[b]-conceptAct[a];}).slice(0,4);
  // 5. 主导情绪
  var dominantEmotion='';var maxEmo=0;
  for(var e in emotionAct){if(emotionAct[e]>maxEmo){maxEmo=emotionAct[e];dominantEmotion=e;}}
  // 6. 生成理解表述
  var conceptMap={暴力:'有暴力发生',伤害:'有人受伤了',痛苦:'有人很痛苦',危险:'有危险',未知:'情况不明',冲突:'起了冲突',不公:'这不公平',犯罪:'有人在作恶',财富:'跟钱有关',援助:'需要帮忙',悲伤:'很悲伤',恐惧:'让人害怕',损失:'有损失',社交:'跟人打交道',消息:'有新消息',搜寻:'在找什么',异常:'不太对劲',威胁:'有威胁',机会:'可能有好处',外来者:'有外人来了',脆弱:'有人很脆弱',合作:'需要合作',交易:'有交易',黑暗:'环境危险',聚集:'人多的地方',日常:'日常小事',神秘:'很神秘',紧急:'事情紧急',秘密:'有秘密',权威:'涉及权威',资源:'涉及资源',失去:'有所失去',不变:'很平常',灾难:'重大灾难',破坏:'破坏性事件',疾病:'有人生病了',野兽:'有野兽出没',英雄:'需要英雄站出来',终结:'已经结束了',仪式:'有仪式',逃避:'有人在逃避',安全:'安全第一',希望:'有希望',冒险:'有风险',自由:'自由了',分离:'分开了',归属:'归属感',远处:'远处发生了事',自然:'自然的力量',屏障:'有屏障',快乐:'值得高兴的事',欺骗:'有人在说谎',背叛:'被背叛了',不诚实:'有人在说谎',好感:'有感情',亲近:'关系亲近',厌恶:'令人反感',排斥:'被排斥',恨意:'带着恨意',仇恨:'带着仇恨',遗憾:'很遗憾',后悔:'很后悔',孤独:'很孤独',孤立:'被孤立',期待:'有所期待',渴望:'很渴望',正面:'是好事',负面:'不是好事',正确:'做得对',错误:'犯了错',认可:'被认可',善意:'带着善意',歉意:'在道歉',乏味:'很无聊',审美:'关乎外表',年龄:'关于年纪',经验:'有经验',活力:'有活力',赞美:'在赞美',否定:'在否定',关心:'在关心',担忧:'在担忧',烦躁:'很烦躁',不适:'不舒服',环境:'环境问题',变化:'情况有变',开始:'新的开始',结束:'告一段落',未来:'关于未来',过去:'关于过去',现在:'关于现在',珍贵:'很珍贵',稀有:'很稀有',生存:'事关生存',满足:'感到满足',需求:'有需求',体力:'体力不支',睡眠:'需要休息',警觉:'提起警觉',小心:'需要小心',确认:'在确认',真实:'是真实的',虚假:'是假的',怀疑:'令人怀疑',能力:'关于能力',优势:'有优势',劣势:'处于劣势',保护:'需要保护',愿意:'表示愿意',拒绝:'表示拒绝',贪婪:'有贪念',欲望:'有欲望',计划:'在计划',回忆:'在回忆',价值:'有价值',贵重:'很贵重',稀缺:'很稀缺',权利:'涉及权利',公平:'需要公平',不公平:'不公平',对抗:'在对抗',对立:'立场对立',反抗:'在反抗',施舍:'在施舍',客气:'在客气',客气:'在客气',礼貌:'表示礼貌',回报:'期待回报',奉献:'愿意奉献',选择:'做出选择',界限:'有界限',禁忌:'有禁忌',和解:'在和解',不安:'感到不安',压抑:'感到压抑',无力:'感到无力',失落:'感到失落',不满:'感到不满',反感:'感到反感'};
  var interpretation=topConcepts.length>0?topConcepts.map(function(c){return conceptMap[c]||c;}).join('，'):'发生了什么事';
  return {keywords:keywords,concepts:topConcepts,dominantEmotion:dominantEmotion,emotionAct:emotionAct,interpretation:interpretation,subject:extractSubject(text,keywords)};
}
function extractSubject(text,keywords){
  // 优先用匹配到的关键词做主语
  if(keywords&&keywords.length>0){
    // 内容词优先：事物/事件/情绪 > 价值判断词
    var valueWords={好:1,坏:1,对:1,错:1,不错:1,美:1,丑:1,大:1,小:1,强:1,弱:1,老:1,年轻:1,真:1,假:1,死了:1};
    var contentWords=[],judgeWords=[];
    for(var i=0;i<keywords.length;i++){
      if(valueWords[keywords[i]])judgeWords.push(keywords[i]);
      else contentWords.push(keywords[i]);
    }
    // 先选内容词中最长的，没有再选判断词
    var candidates=contentWords.length>0?contentWords:judgeWords;
    var best=candidates[0];
    for(var i=1;i<candidates.length;i++){if(candidates[i].length>best.length)best=candidates[i];}
    return best;
  }
  // 回退：正则提取
  var words=text.replace(/[，。！？、\s\[\]]/g,'');
  var m=words.match(/(.{2,6})(?:在|来|去|到|走|跑|坐|站|躺|看|说|喊|哭|笑|打|偷|吵|找|丢|拿|感觉|觉得|认为)/);
  return m?m[1]:'这件事';
}

// ═══════════════ 句子结构分析（理解谁对谁做了什么、说话人意图） ═══════════════
// 不再只看关键词，而是分析整句的主谓宾关系和意图类型
function analyzeSentence(msg){
  // 意图1：指控 —— "你偷/抢/骗/打/骂/伤了(我的)X"
  var accMatch=msg.match(/你(偷|抢|骗|拿|打|骂|伤|害|杀|砸|烧|毁|弄|搞|动|碰)(?:了|过)?(?:我(?:的)?)?(.{1,6})?/);
  if(accMatch)return {intent:'accusation',actor:'你',target:'我',action:accMatch[1],object:accMatch[2]||'',desc:'指控你'+accMatch[1]+'了'+(accMatch[2]||'我')};
  // 意图1b：指责 —— "你撒谎/骗人/胡说"
  var blameMatch=msg.match(/你(撒谎|骗人|胡说|瞎说|乱说|说谎|吹牛|吹嘘|装|假装|演戏|骗我|骗大家)/);
  if(blameMatch)return {intent:'accusation',actor:'你',target:'我',action:blameMatch[1],object:'',desc:'指责你'+blameMatch[1]};
  // 意图1c：讨厌/恨 —— "我讨厌你" / "我恨你"
  var hateMatch=msg.match(/我(讨厌|恨|厌恶|烦|不喜欢|受够)(?:了)?(?:你|这个人)?/);
  if(hateMatch)return {intent:'accusation',actor:'我',target:'你',action:hateMatch[1],object:'',desc:'对你表达'+hateMatch[1]};
  // 意图2：外部事件 —— "外面X了" / "X了"
  var extMatch=msg.match(/外面(着火|出事|打起来|吵起来|闹起来|下(?:雨|雪)|刮风|打雷|闪电)/);
  if(extMatch)return {intent:'external_event',event:extMatch[1],location:'外面',desc:'外面发生了'+extMatch[1]};
  // 意图2b：事件通报 —— "着火了" / "地震了"
  var eventMatch=msg.match(/(着火|地震|洪水|发大水|塌了|倒了|炸了|死人|出事|打架|吵架|闹鬼)(?:了|啦)?/);
  if(eventMatch)return {intent:'external_event',event:eventMatch[1],location:'',desc:'通报'+eventMatch[1]};
  // 意图3：自我状态 —— "我很X" / "我好X"
  var selfMatch=msg.match(/我(?:很|好|非常|特别|有点|有点儿|太|真的)?(难过|伤心|害怕|开心|高兴|生气|愤怒|紧张|后悔|失望|孤独|寂寞|无聊|累|困|饿|渴|冷|热|疼|痛|不舒服|烦|郁闷|沮丧|激动|感动|幸福|满足|得意|骄傲|惭愧|内疚|担忧|担心|焦虑|烦躁)(?:死了|极了|得很|得不行|得要命|得受不了)?(?:了|啦)?/);
  if(selfMatch)return {intent:'self_state',state:selfMatch[1],speaker:'我',desc:'表达自己'+selfMatch[1]};
  // 意图3b：自我遭遇 —— "我受伤了" / "我生病了"
  var selfActMatch=msg.match(/我(受伤|生病|发烧|感冒|摔倒|迷路|走丢|找不到|丢了|忘了|梦到|梦见|遇到|碰到|发现|看到|听见|闻到)(?:了|啦)?/);
  if(selfActMatch)return {intent:'self_state',state:selfActMatch[1],speaker:'我',desc:'表达自己'+selfActMatch[1]};
  // 意图4：给予/提议 —— "给你X" / "送你X"
  var giveMatch=msg.match(/(?:给|送|分|分给|留给|递给)(?:你|大家|你们)(?:一[个些点张块把份]|一点|一些)?(.{1,8})/);
  if(giveMatch)return {intent:'offer',item:giveMatch[1],recipient:'你',desc:'要给你'+giveMatch[1]};
  // 意图4b：一起做 —— "一起X吧"
  var togetherMatch=msg.match(/一起(.{1,6})(?:吧|啊|呗|呀|啦)?/);
  if(togetherMatch)return {intent:'offer',item:togetherMatch[1],recipient:'一起',desc:'提议一起'+togetherMatch[1]};
  // 意图5：提问 —— "你X吗？" / "X呢？"
  var askMatch=msg.match(/(?:你|你们)?(.{1,10})(?:吗|呢|吧|了没|了没有|没有|不|是不是|能不能|行不行|可不可以|怎么样|如何|咋样|咋办|怎么办|什么意思|怎么看)(?:[？?]?)?/);
  if(askMatch&&(msg.indexOf('吗')>=0||msg.indexOf('呢')>=0||msg.indexOf('？')>=0||msg.indexOf('?')>=0))return {intent:'question',topic:askMatch[1],desc:'在问关于'+askMatch[1]};
  // 意图6：感谢/道歉
  if(msg.indexOf('谢谢')>=0||msg.indexOf('感谢')>=0)return {intent:'gratitude',desc:'在感谢你'};
  if(msg.indexOf('对不起')>=0||msg.indexOf('抱歉')>=0||msg.indexOf('不好意思')>=0)return {intent:'apology',desc:'在道歉'};
  // 意图7：评价 —— "你很X" / "你真X"
  var praiseMatch=msg.match(/你(?:很|真|好|太|非常|特别|挺|蛮|够|确实|真的)(.{1,4})/);
  if(praiseMatch)return {intent:'judgment',judgment:praiseMatch[1],target:'你',desc:'评价你'+praiseMatch[1]};
  // 意图8：请求 —— "帮我X" / "能不能X"
  var reqMatch=msg.match(/(?:帮|帮帮|请|求|求求|麻烦)(?:我|一下|你)?(?:帮)?(.{1,8})/);
  if(reqMatch)return {intent:'request',action:reqMatch[1],desc:'请求你'+reqMatch[1]};
  return {intent:'unknown',desc:'说了些什么'};
}

// 增强版语义理解：关键词+句子结构+意图
function understandEventFull(msg,npc){
  var base=understandEvent(msg,npc);
  var structure=analyzeSentence(msg);
  base.structure=structure;
  // 句子结构修正概念
  if(structure.intent!=='unknown'){
    if(structure.intent==='accusation'){
      if(base.concepts.indexOf('冲突')<0)base.concepts.unshift('冲突');
      if(base.concepts.indexOf('不公')<0)base.concepts.unshift('不公');
    }else if(structure.intent==='self_state'){
      if(base.concepts.indexOf('脆弱')<0)base.concepts.unshift('脆弱');
    }else if(structure.intent==='external_event'){
      if(base.concepts.indexOf('紧急')<0)base.concepts.unshift('紧急');
    }
    base.interpretation=structure.desc+'，'+base.interpretation;
  }
  return base;
}

// 心口不一判断（来自灵魂工坊 v4）
function shouldDiverge(npc,understanding,manualMood){
  var p=npc.personality;var reasons=[];
  var structure=understanding.structure;
  var isAccusation=structure&&structure.intent==='accusation';
  var isSelfState=structure&&structure.intent==='self_state';
  var isExternalEvent=structure&&structure.intent==='external_event';
  // 善意的谎言：善良>70 + 对方情绪低落/悲伤
  if(p.善良>70&&(manualMood==="sad"||manualMood==="fear")){
    reasons.push({type:'whiteLie',weight:3.5});
  }
  if(p.善良>65&&understanding&&understanding.concepts){
    if(understanding.concepts.indexOf('悲伤')>=0||understanding.concepts.indexOf('痛苦')>=0){
      reasons.push({type:'whiteLie',weight:2.5});
    }
  }
  // 自我状态→善意谎言（善良NPC安慰时可能心口不一）
  if(isSelfState&&p.善良>65){reasons.push({type:'whiteLie',weight:2});}
  // 心口不一：贪婪>55 + 涉及利益
  if(p.贪婪>55&&understanding&&understanding.concepts&&(understanding.concepts.indexOf('财富')>=0||understanding.concepts.indexOf('交易')>=0||understanding.concepts.indexOf('资源')>=0)){
    reasons.push({type:'greedyMask',weight:3});
  }else if(p.贪婪>55){reasons.push({type:'greedyMask',weight:2});}
  // 隐藏恐惧：勇敢>60 + 理解到危险/威胁
  if(p.勇敢>60&&understanding&&understanding.concepts){
    if(understanding.concepts.indexOf('危险')>=0||understanding.concepts.indexOf('威胁')>=0||understanding.concepts.indexOf('恐惧')>=0){
      reasons.push({type:'hiddenFear',weight:3});
    }
  }
  // 外部事件→隐藏恐惧（勇敢NPC面对突发事件时内心也怕）
  if(isExternalEvent&&p.勇敢>55){reasons.push({type:'hiddenFear',weight:2.5});}
  // 沉默风暴：沉默>55
  if(p.沉默>55){reasons.push({type:'silentStorm',weight:2.5});}
  // 指控→沉默风暴加成（被指控时沉默型内心翻江倒海）
  if(isAccusation&&p.沉默>50){reasons.push({type:'silentStorm',weight:3});}
  // 社交伪装：社交>65 + 冲突场景或公开场合
  if(p.社交>65&&understanding&&understanding.concepts&&(understanding.concepts.indexOf('冲突')>=0||understanding.concepts.indexOf('不和')>=0)){
    reasons.push({type:'socialMask',weight:2.5});
  }
  if(p.社交>70&&(manualMood==="public")){reasons.push({type:'socialMask',weight:2});}
  // 指控→社交伪装加成（被公开指控时高社交NPC表面客气内心翻白眼）
  if(isAccusation&&p.社交>60){reasons.push({type:'socialMask',weight:2.8});}
  if(reasons.length===0)return null;
  reasons.sort(function(a,b){return b.weight-a.weight;});
  var probability=.30+(reasons[0].weight*.12);
  if(Math.random()<probability)return {type:reasons[0].type,reason:reasons[0]};
  return null;
}

// 生成内心真实想法（来自灵魂工坊 v4）
function genInnerThought(npc,divergenceType){
  var style=npc.speechStyle||'normal';
  var pool=INNER_THOUGHTS[divergenceType];
  if(!pool)return null;
  var thoughts=pool[style]||pool.normal||[];
  if(thoughts.length===0)return null;
  return thoughts[Math.floor(Math.random()*thoughts.length)];
}

// ═══════════════ 观点形成系统（来自灵魂工坊 v4） ═══════════════
// 每个NPC对同一句话形成自己的"看法"——基于理解（概念+情绪）生成语境化观点
function formOpinion(npc,msg,understanding){
  var p=npc.personality;var subject=understanding.subject||'这件事';
  var concepts=understanding.concepts||[];
  var domEmo=understanding.dominantEmotion||'';
  var interpretations=[];
  // 基于理解的主题生成观点，而非机械套性格模板
  // 正面情绪（感激/快乐/温暖/希望）→ 积极回应
  if(domEmo==='gratitude'||domEmo==='happiness'||domEmo==='warmth'||domEmo==='hope'){
    if(p.善良>60)interpretations.push({text:subject+'……你真好，我很高兴',stance:'warm'});
    if(p.社交>60)interpretations.push({text:'哈哈，'+subject+'？这有什么好谢的！',stance:'friendly'});
    if(p.沉默>60)interpretations.push({text:'……（嘴角微扬）'+subject+'……',stance:'quiet_pleased'});
    interpretations.push({text:subject+'……谢谢你这么说',stance:'grateful'});
  }
  // 负面情绪（悲伤/恐惧/遗憾/孤独）→ 共情或回避
  else if(domEmo==='sadness'||domEmo==='sympathy'||domEmo==='regret'||domEmo==='fear'){
    if(p.善良>70)interpretations.push({text:subject+'挺可怜的，需要帮助',stance:'compassionate'});
    if(p.正义>70)interpretations.push({text:'这不公平，得有人管',stance:'righteous'});
    if(p.勇敢>60)interpretations.push({text:subject+'？没什么好怕的',stance:'brave'});
    if(p.沉默>60)interpretations.push({text:'……（默默听着）'+subject+'……',stance:'observant'});
    if(p.好奇>60)interpretations.push({text:subject+'？怎么回事？得问清楚',stance:'curious'});
    interpretations.push({text:subject+'……先看看再说',stance:'neutral'});
  }
  // 愤怒/冲突 → 对抗或回避
  else if(domEmo==='anger'||domEmo==='annoyance'||domEmo==='hatred'){
    if(p.暴躁>60)interpretations.push({text:'烦死了，'+subject+'？又来事',stance:'irritated'});
    if(p.正义>70)interpretations.push({text:subject+'？谁干的？这不公平',stance:'righteous'});
    if(p.沉默>60)interpretations.push({text:'……（压下怒火）'+subject+'……',stance:'suppressed'});
    if(p.社交>60)interpretations.push({text:subject+'？别激动，有话好好说',stance:'conciliatory'});
    interpretations.push({text:subject+'……先冷静',stance:'neutral'});
  }
  // 贪婪/欲望 → 算计
  else if(domEmo==='greed'||domEmo==='desire'){
    if(p.贪婪>55)interpretations.push({text:subject+'？说不定有利可图',stance:'opportunistic'});
    if(p.善良>60)interpretations.push({text:subject+'……这不太好吧',stance:'hesitant'});
    interpretations.push({text:subject+'？真的假的？',stance:'skeptical'});
  }
  // 好奇 → 追问
  else if(domEmo==='curiosity'){
    if(p.好奇>60)interpretations.push({text:subject+'？有意思，得搞清楚',stance:'curious'});
    if(p.沉默>60)interpretations.push({text:'……（竖起耳朵）'+subject+'？',stance:'silent_curious'});
    interpretations.push({text:subject+'？说来听听',stance:'interested'});
  }
  // 默认：基于性格的通用观点
  if(interpretations.length===0){
    if(p.好奇>70)interpretations.push({text:subject+'？有意思，得搞清楚',stance:'curious'});
    if(p.善良>70)interpretations.push({text:subject+'……需要帮忙吗？',stance:'compassionate'});
    if(p.正义>70)interpretations.push({text:'嗯，'+subject+'……得有个说法',stance:'righteous'});
    if(p.沉默>70)interpretations.push({text:'……（默默观察）'+subject,stance:'observant'});
    if(p.社交>70)interpretations.push({text:subject+'？哈哈，你说得对',stance:'friendly'});
    if(p.懒惰>70)interpretations.push({text:'关我什么事，别找我',stance:'indifferent'});
    if(p.暴躁>70)interpretations.push({text:'烦死了，又来事',stance:'irritated'});
    if(p.贪婪>70)interpretations.push({text:'说不定有利可图',stance:'opportunistic'});
    if(p.勇敢>70)interpretations.push({text:'没什么好怕的',stance:'brave'});
    if(interpretations.length===0)interpretations.push({text:subject+'……先看看再说',stance:'neutral'});
  }
  var totalWeight=0;var weighted=[];
  interpretations.forEach(function(ip,i){var w=i===0?3:1;totalWeight+=w;weighted.push({ip:ip,w:totalWeight});});
  var roll=Math.random()*totalWeight;
  var chosen=null;
  for(var i=0;i<weighted.length;i++){if(roll<weighted[i].w){chosen=weighted[i].ip;break;}}
  return chosen||interpretations[0];
}

// 根据NPC的语义理解+观点，生成表面回应
// 核心：意图优先——先看句子结构判断用户意图，再选对应模板
// 意图模板用{action}/{object}/{state}/{event}等占位符，精确回应用户表达
function genSurfaceResponse(npc,msg,understanding,opinion){
  var style=npc.speechStyle||'normal';
  var patterns=SURFACE_PATTERNS[style]||SURFACE_PATTERNS.normal;
  var structure=understanding.structure;
  var subject=understanding.subject;
  var surface='';

  // 第一优先：句子结构分析出了明确意图 → 用意图模板
  if(structure&&structure.intent&&structure.intent!=='unknown'){
    var intent=structure.intent;
    // intent→模板类别映射
    var intentCategory={
      'accusation':'accusation',
      'self_state':'self_state',
      'external_event':'external_event',
      'gratitude':'gratitude',
      'apology':'apology',
      'judgment':'judgment',
      'request':'request',
      'offer':'offer',
      'question':'question'
    };
    var cat=intentCategory[intent];
    if(cat&&patterns[cat]){
      var pool=patterns[cat];
      // 过滤掉不适合的模板：如果{object}为空，跳过含"你的{object}"的模板
      var hasObject=structure.object&&structure.object.length>0;
      if(!hasObject){
        pool=pool.filter(function(t){return t.indexOf('你的{object}')<0&&t.indexOf('{object}')<0;});
        if(pool.length===0)pool=patterns[cat]; // 都过滤掉了就用回全部
      }
      surface=pool[Math.floor(Math.random()*pool.length)];
      // 替换意图占位符
      if(structure.action)surface=surface.replace(/\{action\}/g,structure.action);
      if(structure.object)surface=surface.replace(/\{object\}/g,structure.object);
      if(structure.state)surface=surface.replace(/\{state\}/g,structure.state);
      if(structure.event)surface=surface.replace(/\{event\}/g,structure.event);
      if(structure.item)surface=surface.replace(/\{item\}/g,structure.item||subject);
      // 清理未替换的占位符
      surface=surface.replace(/\{action\}/g,'').replace(/\{object\}/g,'').replace(/\{state\}/g,'').replace(/\{event\}/g,'').replace(/\{item\}/g,'');
      surface=surface.replace(/你的(?=\s|。|！|？|$)/g,'').replace(/\s{2,}/g,' ').trim();
      // 把{subject}也替换为实际主语（如果有）
      if(subject&&subject!=='这件事')surface=surface.replace(/\{subject\}/g,subject);
      return surface;
    }
  }

  // 第二优先：情绪驱动模板（原有逻辑）
  var domEmo=understanding.dominantEmotion;
  var category='normal';
  if(domEmo==='fear'||domEmo==='anxiety')category='fear';
  else if(domEmo==='anger'||domEmo==='annoyance'||domEmo==='hatred'||domEmo==='disgust')category='anger';
  else if(domEmo==='sadness'||domEmo==='sympathy'||domEmo==='regret')category='sadness';
  else if(domEmo==='greed'||domEmo==='desire')category='offer';
  else if(domEmo==='curiosity')category='question';

  // 没有匹配到关键词时，使用 fallback 模板
  if(!subject||subject==='这件事'){
    var fallback=patterns.fallback||['……嗯？','你说什么？','没听明白。','哦？'];
    return fallback[Math.floor(Math.random()*fallback.length)];
  }
  var pool=patterns[category]||patterns.normal;
  surface=pool[Math.floor(Math.random()*pool.length)];
  surface=surface.replace(/\{subject\}/g,subject);
  return surface;
}

// ═══════════════ 计算所有5种分歧评分（用于面板展示） ═══════════════
function scoreAllDivergence(npc,understanding,manualMood){
  var p=npc.personality;var results=[];
  var structure=understanding.structure;
  var isAccusation=structure&&structure.intent==='accusation';
  var isSelfState=structure&&structure.intent==='self_state';
  var isExternalEvent=structure&&structure.intent==='external_event';
  // 善意谎言
  var wlScore=0;
  if(p.善良>70&&(manualMood==="sad"||manualMood==="fear"))wlScore=3.5;
  else if(p.善良>65&&understanding&&understanding.concepts&&(understanding.concepts.indexOf('悲伤')>=0||understanding.concepts.indexOf('痛苦')>=0))wlScore=2.5;
  else if(p.善良>60)wlScore=0.5;
  if(isSelfState&&p.善良>65)wlScore=Math.max(wlScore,2);
  results.push({type:'whiteLie',score:wlScore});
  // 心口不一
  var gmScore=0;
  if(p.贪婪>55&&understanding&&understanding.concepts&&(understanding.concepts.indexOf('财富')>=0||understanding.concepts.indexOf('交易')>=0||understanding.concepts.indexOf('资源')>=0))gmScore=3;
  else if(p.贪婪>55)gmScore=2;
  else if(p.贪婪>40)gmScore=0.5;
  results.push({type:'greedyMask',score:gmScore});
  // 隐藏恐惧
  var hfScore=0;
  if(p.勇敢>60&&understanding&&understanding.concepts&&(understanding.concepts.indexOf('危险')>=0||understanding.concepts.indexOf('威胁')>=0||understanding.concepts.indexOf('恐惧')>=0))hfScore=3;
  else if(p.勇敢>55)hfScore=1;
  if(isExternalEvent&&p.勇敢>55)hfScore=Math.max(hfScore,2.5);
  results.push({type:'hiddenFear',score:hfScore});
  // 沉默风暴
  var ssScore=0;
  if(p.沉默>55)ssScore=2.5+(p.沉默-55)*0.05;
  else if(p.沉默>40)ssScore=1;
  if(isAccusation&&p.沉默>50)ssScore=Math.max(ssScore,3);
  results.push({type:'silentStorm',score:ssScore});
  // 社交伪装
  var smScore=0;
  if(p.社交>65&&understanding&&understanding.concepts&&(understanding.concepts.indexOf('冲突')>=0||understanding.concepts.indexOf('不和')>=0))smScore=2.5;
  else if(p.社交>70&&(manualMood==="public"))smScore=2;
  else if(p.社交>60)smScore=0.5;
  if(isAccusation&&p.社交>60)smScore=Math.max(smScore,2.8);
  results.push({type:'socialMask',score:smScore});
  return results;
}

// ═══════════════ 发送消息（v4 语义理解管线） ═══════════════
function sendMessage(){
  if(!selectedNpc)return;
  var input=document.getElementById("msgInput");
  var msg=input.value.trim();
  if(!msg)return;
  input.value="";
  input.focus();

  var npc=selectedNpc;
  chatHistory.push({role:"user",text:msg});

  // 步骤1：增强语义理解（v4管线：关键词+句子结构+意图识别）
  var understanding=understandEventFull(msg,npc);
  var kwStr=understanding.keywords.length>0?understanding.keywords.join("、") : "无匹配关键词（字符级分析）";
  var conceptStr=understanding.concepts.length>0?understanding.concepts.join("，") : "无明确概念";
  var intentStr=understanding.structure&&understanding.structure.intent!=='unknown'?(' 意图：'+understanding.structure.desc) : '';
  updateAlgoStep("step1","关键词："+kwStr+"\n概念："+conceptStr+"\n理解："+understanding.interpretation+"\n情绪："+(understanding.dominantEmotion||"无明显情绪")+intentStr);

  // 步骤2：观点形成（v4管线：基于性格形成对事件的观点）
  var opinion=formOpinion(npc,msg,understanding);
  updateAlgoStep("step2","性格观点："+opinion.text+"\n立场："+opinion.stance);

  // 步骤3：分歧评分（面板展示所有5种类型）
  var allDivScores=scoreAllDivergence(npc,understanding,currentMood);
  updateTypeScores(allDivScores);

  // 步骤4：实际分歧判断（v4管线：shouldDiverge决定是否触发心口不一）
  var divResult=shouldDiverge(npc,understanding,currentMood);

  // 生成表面回应
  var surface=genSurfaceResponse(npc,msg,understanding,opinion);

  // 渲染用户消息
  appendUserMessage(msg);

  // 渲染NPC响应
  if(divResult){
    var divInfo=DIVERGENCE_TYPES[divResult.type];
    var inner=genInnerThought(npc,divResult.type);
    if(!inner)inner='（……）';
    var reasonStr=divResult.type+'权重'+divResult.reason.weight.toFixed(1);
    appendNPCDualMessage(npc,surface,inner,divInfo,reasonStr);
    flashDot(npc.id,divInfo.color);
    showAlgoDecision(true,divInfo,reasonStr,Math.round((0.30+divResult.reason.weight*0.12)*100));
  }else{
    appendNPCMessage(npc,surface);
    showAlgoDecision(false);
  }

  scrollToBottom();
}

  var empty=container.querySelector(".empty-state");
  if(empty)empty.remove();
  container.innerHTML+='<div class="msg-row user"><div class="msg-meta">你</div><div class="msg-bubble">'+escHtml(msg)+'</div></div>';
}

}

function appendNPCDualMessage(npc,surface,inner,divInfo,reasonStr){
  var container=document.getElementById("chatMessages");
  var html='<div class="msg-row npc">';
  html+='<div class="msg-meta" style="color:'+npc.color+'">'+npc.avatar+' '+npc.name+'</div>';
  html+='<div class="dual-bubble">';
  html+='<div class="surface-bubble"><span class="bubble-label">说出口的</span>'+escHtml(surface)+'</div>';
  html+='<div class="inner-bubble"><span class="bubble-label">真实想法</span>'+escHtml(inner)+'</div>';
  html+='</div>';
  html+='<div class="div-tag" style="background:'+divInfo.color+'15;color:'+divInfo.color+'">'+divInfo.icon+' '+divInfo.name+' · 触发：'+reasonStr+'</div>';
  html+='</div>';
  container.innerHTML+=html;
}

function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ═══════════════ 算法面板 ═══════════════
function updateAlgoStep(id,text){
  var el=document.getElementById(id);
  el.classList.add("active");
  el.innerHTML='<span class="step-num">▶</span> <span class="step-action">'+text.replace(/\n/g,"<br>")+'</span>';
  setTimeout(function(){el.classList.remove("active");},1500);
}

function updateTypeScores(results){
  var typeMap={"whiteLie":0,"greedyMask":1,"hiddenFear":2,"silentStorm":3,"socialMask":4};
  var items=document.getElementById("typeList").children;
  // 重置
  for(var i=0;i<items.length;i++){
    items[i].querySelector(".score").textContent="-";
  }
  results.forEach(function(r){
    var idx=typeMap[r.type];
    if(idx!==undefined){
      items[idx].querySelector(".score").textContent=r.score.toFixed(1);
    }
  });
}

function showAlgoDecision(triggered,divInfo,reasonStr,prob){
  var el=document.getElementById("algoDecision");
  if(triggered){
    el.className="algo-decision show";
    el.style.background="rgba(192,132,252,.08)";
    el.style.borderColor="rgba(192,132,252,.2)";
    el.style.color="#C084FC";
    el.innerHTML=divInfo.icon+' <b>触发心口不一</b> — '+divInfo.name+'<br>概率 ~'+prob+'% | '+reasonStr;
  }else{
    el.className="algo-decision show";
    el.style.background="rgba(156,163,175,.08)";
    el.style.borderColor="rgba(156,163,175,.2)";
    el.style.color="#9CA3AF";
    el.innerHTML='💬 <b>未触发心口不一</b><br>条件不满足，NPC直率回应';
    setTimeout(function(){
      el.style.background="rgba(192,132,252,.08)";
      el.style.borderColor="rgba(192,132,252,.2)";
      el.style.color="#C084FC";
    },2000);
  }
}

function resetAlgoPanel(){
  document.getElementById("step1").innerHTML="等待输入...";
  document.getElementById("step1").classList.remove("active");
  document.getElementById("step2").innerHTML="等待输入...";
  document.getElementById("step2").classList.remove("active");
  var items=document.getElementById("typeList").children;
  for(var i=0;i<items.length;i++){
    items[i].querySelector(".score").textContent="-";
  }
  document.getElementById("algoDecision").classList.remove("show");
}

function flashDot(npcId,color){
  var dot=document.getElementById("dot-"+npcId);
  if(!dot)return;
  dot.style.background=color;
  dot.classList.add("lit");
  setTimeout(function(){dot.classList.remove("lit");},1500);
}

function scrollToBottom(){
  var container=document.getElementById("chatMessages");
  setTimeout(function(){
    container.scrollTop=container.scrollHeight;
  },100);
}

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&document.activeElement===document.getElementById("msgInput")){

function openCreatePanel(){
  document.getElementById('createPanel').classList.add('open');
  document.getElementById('createBackdrop').classList.add('open');
  var defaults={正义:50,勇敢:50,沉默:50,贪婪:50,善良:50,暴躁:50,好奇:50,社交:50,勤劳:50,懒惰:50};
  document.getElementById('c-traits').innerHTML=traits.map(function(t){return '<div class="create-trait"><label>'+t+'</label><input type="range" min="0" max="100" value="'+defaults[t]+'" id="ct-'+t+'" oninput="document.getElementById(\'ctv-'+t+'\').textContent=this.value"><span class="mt-val" id="ctv-'+t+'">'+defaults[t]+'</span></div>';}).join('');
  document.getElementById('c-name').value='';document.getElementById('c-role').value='';document.getElementById('c-avatar').value='';document.getElementById('c-style').value='';updateCreatePreview();
  document.getElementById('c-name').focus();
}
function closeCreatePanel(){
  document.getElementById('createPanel').classList.remove('open');
  document.getElementById('createBackdrop').classList.remove('open');
}
function updateCreatePreview(){
  var name=document.getElementById('c-name').value.trim()||'新意识体';
  var role=document.getElementById('c-role').value.trim()||'村民';
  var avatar=document.getElementById('c-avatar').value;
  var color=document.getElementById('c-color').value;
  document.getElementById('createPreviewName').textContent=name;
  document.getElementById('createPreviewRole').textContent=role;
  var prev=document.getElementById('createPreviewAvatar');
  prev.textContent=avatar;prev.style.color=color;prev.style.background=color+'18';
}
function randomizeTraits(){
  traits.forEach(function(t){var v=Math.floor(Math.random()*80)+10;var slider=document.getElementById('ct-'+t);var val=document.getElementById('ctv-'+t);if(slider)slider.value=v;if(val)val.textContent=v;});
}
function applyPreset(name){
  var presets={
    热心肠:{正义:85,勇敢:60,沉默:30,贪婪:10,善良:80,暴躁:15,好奇:45,社交:70,勤劳:65,懒惰:20},
    铁公鸡:{正义:25,勇敢:30,沉默:70,贪婪:90,善良:20,暴躁:40,好奇:35,社交:20,勤劳:55,懒惰:55},
    急性子:{正义:45,勇敢:65,沉默:20,贪婪:30,善良:40,暴躁:85,好奇:75,社交:50,勤劳:40,懒惰:25},
    老好人:{正义:55,勇敢:30,沉默:75,贪婪:10,善良:85,暴躁:10,好奇:35,社交:45,勤劳:60,懒惰:35},
    独行侠:{正义:60,勇敢:80,沉默:85,贪婪:15,善良:50,暴躁:30,好奇:30,社交:15,勤劳:55,懒惰:40},
    乐天派:{正义:50,勇敢:35,沉默:20,贪婪:15,善良:80,暴躁:10,好奇:75,社交:65,勤劳:30,懒惰:55}
  };
  var p=presets[name];if(!p)return;
  traits.forEach(function(t){var slider=document.getElementById('ct-'+t);var val=document.getElementById('ctv-'+t);if(slider){slider.value=p[t]||50;}if(val){val.textContent=p[t]||50;}});
}
function createNPC(){
  var name=document.getElementById('c-name').value.trim();if(!name)return;
  var role=document.getElementById('c-role').value.trim()||'村民';
  var avatar=document.getElementById('c-avatar').value;
  var color=document.getElementById('c-color').value;
  var styleRaw=document.getElementById('c-style').value.trim();
  var styleMap={沉默寡言:'silent',普普通通:'normal',絮絮叨叨:'talkative',温温柔柔:'gentle'};
  var style=styleMap[styleRaw]||'normal';
  var personality={};traits.forEach(function(t){personality[t]=+document.getElementById('ct-'+t).value;});
  nextNPCId++;var id='N'+nextNPCId;
  var npc={id:id,name:name,role:role,roleEco:null,avatar:avatar,color:color,personality:personality,speechStyle:style,mood:'neutral',moodHistory:[],anger:10,trust:50,happiness:50,memories:[],activeGoal:null,planQueue:[],socialFatigue:0,hunger:50,energy:100,lastDialogue:null,opinions:[],grudges:{},favors:{},habits:{},beliefs:{},dissonance:[],attentionLocked:false,attentionTarget:null,attentionUntil:0,emotionalState:{fear:0,urgency:0,relief:0,aftermath:0},reflections:[],commitments:[],position:{x:0,y:0},frustration:0,stressTicks:0,exhaustion:0,subcultures:[],inventory:{food:3,tools:2,coin:15,iron:1}};
  NPCS.push(npc);
  REL[id]={};
  NPCS.forEach(function(n){if(n.id===id)return;REL[n.id][id]={t:50,r:'新识'};REL[id][n.id]={t:50,r:'新识'};});
  renderNPCList();
  closeCreatePanel();
}
function deleteNPC(id){
  if(NPCS.length<=2)return;
  var idx=NPCS.findIndex(function(n){return n.id===id;});if(idx<0)return;
  NPCS.splice(idx,1);
  delete REL[id];for(var k in REL){delete REL[k][id];}
  if(selectedNpc&&selectedNpc.id===id){selectedNpc=NPCS[0];renderTraitSliders();}
  renderNPCList();
}
